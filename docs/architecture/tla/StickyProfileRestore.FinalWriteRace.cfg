\* Reachability check (PR 2649 round 10, thread 4680307478; round 11, threads 4695895338/4695895494).
\* The install pipeline runs three bounded rounds, and a switch that completes
\* during the final round's write used to lose the race by construction. Since
\* round 11 the code closes that loss with an installation-point capture that
\* reads the serving pair and installs the task in one synchronous step. This
\* config runs the sabotage without that capture: StickyMatchesServing must
\* fail on the bounded-loss trace, proving the model still reaches it and that
\* the fixed code is what prevents it.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Mode = "NoFinalCapture"
    Activation = "Guarded"
    CallerPolicies = { "retain-current" }
INVARIANTS TypeOK RestoreKeepsChosen StickyMatchesServing
