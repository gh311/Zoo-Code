\* Reachability check (PR 2649 round 10, thread 4680307478).
\* The install pipeline runs three bounded rounds. Switches land between the
\* writes, and the switch that completes during the final round's write loses
\* the race by construction: the task installs with the round-3 saved name
\* while the active profile moved on. NoFinalWriteLoss must fail. If not, the
\* model cannot reach the final-write outcome the review asked for.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Mode = "Fixed"
    Activation = "Guarded"
    CallerPolicies = { "retain-current" }
INVARIANTS TypeOK RestoreKeepsChosen StickyMatchesServing NoFinalWriteLoss
