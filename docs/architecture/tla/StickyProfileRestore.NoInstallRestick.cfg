\* Sabotage check. The first fix as committed at c60d763ba (PR 2649 round 1):
\* the decision re-sticks the task to the active profile, but the installation
\* does not re-read it. A switch that interleaves between the restore decision
\* and the installation leaves the installed task with a stale saved name.
\* StickyMatchesServing must fail. If not, the interleaving check is vacuous.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    CallerPolicies = { "retain-current" }
    Mode = "NoInstallRestick"
    Activation = "Off"
INVARIANTS TypeOK RestoreKeepsChosen StickyMatchesServing
