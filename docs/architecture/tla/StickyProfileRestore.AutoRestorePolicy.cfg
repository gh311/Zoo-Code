\* Sabotage check (PR 2649 round 10, thread 4680307490).
\* The retain-current policy on an automatic restoration re-sticks the saved
\* name to the global profile with no switch in flight. The restored parent
\* loses its saved profile. SavedSurvivesAutoRestore must fail. If not, the
\* policy input is vacuous.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Mode = "Round10Bug"
    Activation = "Guarded"
    CallerPolicies = { "retain-saved" }
INVARIANTS TypeOK StickyMatchesServing SavedSurvivesAutoRestore
