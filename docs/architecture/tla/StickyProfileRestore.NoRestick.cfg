\* Sabotage check. A wrong partial fix: the restore keeps the current profile but does not write it back to the task.
\* StickyMatchesServing must fail. If not, the invariant is vacuous.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    CallerPolicies = { "retain-current" }
    Mode = "NoRestick"
    Activation = "Off"
INVARIANTS TypeOK RestoreKeepsChosen StickyMatchesServing
