\* Sabotage: the resolver always resolves cwd-relative and never falls
\* back to the raw absolute mention path. Absolute-outside mentions are
\* pinned under the task cwd.
SPECIFICATION Spec
CONSTANTS
    PostNoCwd = TRUE
    AbsWhenNoCwd = TRUE
    AbsFallback = FALSE
    DeskOnlyIfExists = TRUE
    GateDesktopSteer = TRUE
    ShadowCwd = TRUE
INVARIANTS TypeOK TabsReachWebview MentionResolvesToOpenTab TaskCwdExists NoPhantomDesktopSteer
