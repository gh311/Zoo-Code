\* The retain-saved policy run (PR 2649 round 10, thread 4680307490).
\* An automatic parent restoration reactivates the saved profile, so it
\* reverts the user's post-stop switch on purpose. RestoreKeepsChosen must
\* fail. StickyMatchesServing and SavedSurvivesAutoRestore must hold.
\* expect-fail: RestoreKeepsChosen
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Mode = "Fixed"
    Activation = "Guarded"
    CallerPolicies = { "retain-saved" }
INVARIANTS TypeOK RestoreKeepsChosen StickyMatchesServing SavedSurvivesAutoRestore
